name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: instalar jq
        run: sudo apt-get install -y jq
      - name: validar plugin e documentos
        run: ./scripts/validate.sh
      - name: evals dos scripts de auditoria
        run: ./evals/run.sh
